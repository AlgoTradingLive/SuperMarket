name: Build QuickMart APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - name: Verify android.jar and re-install if corrupt
        run: |
          JAR="$ANDROID_HOME/platforms/android-36/android.jar"
          if [ ! -f "$JAR" ] || ! unzip -tq "$JAR" > /dev/null 2>&1; then
            echo "android.jar missing or corrupt, re-installing platform..."
            yes | sdkmanager --uninstall "platforms;android-36" || true
            yes | sdkmanager "platforms;android-36"
          else
            echo "android.jar looks fine."
          fi

      - name: Create fresh Flutter Android scaffold
        run: flutter create --platforms=android --org com.algotradinglive build_project

      - name: Bump Kotlin version for plugin compatibility
        run: |
          sed -i -E 's/(id\s+"org\.jetbrains\.kotlin\.android"\s+version\s+")[^"]*(")/\11.9.22\2/' build_project/android/settings.gradle
          cat build_project/android/settings.gradle | grep kotlin

      - name: Update Target SDK to 36
        run: |
          sed -i "s/compileSdk = flutter.compileSdkVersion/compileSdk = 36/" build_project/android/app/build.gradle
          sed -i "s/targetSdk = flutter.targetSdkVersion/targetSdk = 36/" build_project/android/app/build.gradle
          sed -i "s/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 36/" build_project/android/app/build.gradle
          sed -i "s/compileSdk flutter.compileSdkVersion/compileSdk 36/" build_project/android/app/build.gradle
          sed -i 's/targetSdkVersion 3[45]/targetSdkVersion 36/g' build_project/android/app/build.gradle
          sed -i 's/compileSdk 3[45]/compileSdk 36/g' build_project/android/app/build.gradle
          echo "--- build.gradle मधले SDK संबंधी ओळी ---"
          grep -n -i "sdk" build_project/android/app/build.gradle

      - name: Copy our app code into scaffold
        run: |
          cp -r mobile/lib/. build_project/lib/
          cp mobile/pubspec.yaml build_project/pubspec.yaml
          mkdir -p build_project/assets
          cp -r mobile/assets/. build_project/assets/
          cp mobile/google-services.json build_project/android/app/google-services.json

      - name: Add Firebase Gradle plugins
        run: |
          python3 - << 'PYEOF'
          import re

          # settings.gradle: add google-services + crashlytics plugin versions
          path = "build_project/android/settings.gradle"
          content = open(path).read()
          content = content.replace(
              'id "com.android.application" version',
              'id "com.google.gms.google-services" version "4.4.2" apply false\n    id "com.google.firebase.crashlytics" version "2.9.9" apply false\n    id "com.android.application" version',
              1
          )
          open(path, "w").write(content)

          # app/build.gradle: apply the plugins in this module
          path2 = "build_project/android/app/build.gradle"
          content2 = open(path2).read()
          content2 = re.sub(
              r'(id\s+"kotlin-android")',
              r'\1\n    id "com.google.gms.google-services"\n    id "com.google.firebase.crashlytics"',
              content2,
              count=1
          )
          open(path2, "w").write(content2)
          PYEOF
          echo "--- settings.gradle ---"
          cat build_project/android/settings.gradle
          echo "--- app/build.gradle plugins ---"
          grep -n "id " build_project/android/app/build.gradle

      - name: Add INTERNET and Location permissions
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    <application#' build_project/android/app/src/main/AndroidManifest.xml

      - name: Set app name (label)
        run: |
          sed -i 's/android:label="build_project"/android:label="SuperMarket"/' build_project/android/app/src/main/AndroidManifest.xml

      - name: Set package name (applicationId + namespace)
        run: |
          sed -i 's/applicationId = "com.algotradinglive.build_project"/applicationId = "com.algotradinglive.supermarket"/' build_project/android/app/build.gradle
          sed -i 's/namespace = "com.algotradinglive.build_project"/namespace = "com.algotradinglive.supermarket"/' build_project/android/app/build.gradle

      - name: Move MainActivity to new package folder
        run: |
          OLD_DIR="build_project/android/app/src/main/kotlin/com/algotradinglive/build_project"
          NEW_DIR="build_project/android/app/src/main/kotlin/com/algotradinglive/supermarket"
          mkdir -p "$NEW_DIR"
          find "build_project/android/app/src/main" -name "MainActivity.kt" -exec mv {} "$NEW_DIR/MainActivity.kt" \;
          sed -i 's/package com.algotradinglive.build_project/package com.algotradinglive.supermarket/' "$NEW_DIR/MainActivity.kt"
          rm -rf "$OLD_DIR"

      - name: Get dependencies
        working-directory: build_project
        run: flutter pub get

      - name: Fix aapt2 for Android 36 (AGP/aapt2 mismatch)
        working-directory: build_project
        run: |
          echo "android.aapt2FromMavenOverride=$ANDROID_HOME/build-tools/36.0.0/aapt2" >> android/gradle.properties
          cat android/gradle.properties

      - name: Generate app icon
        working-directory: build_project
        run: flutter pub run flutter_launcher_icons

      - name: Decode keystore
        working-directory: build_project
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/super-market-release.jks

      - name: Create key.properties
        working-directory: build_project
        run: |
          cat > android/key.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=super-market-release.jks
          EOF

      - name: Configure signing in build.gradle
        working-directory: build_project
        run: |
          python3 - << 'PYEOF'
          import re
          path = "android/app/build.gradle"
          content = open(path).read()

          signing_load = '''
          def keystorePropertiesFile = rootProject.file("key.properties")
          def keystoreProperties = new Properties()
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }
          '''
          content = content.replace("android {", signing_load + "\nandroid {", 1)

          signing_config = '''
              signingConfigs {
                  release {
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                      storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                      storePassword keystoreProperties['storePassword']
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          '''
          content = re.sub(r'buildTypes\s*\{\s*release\s*\{[^}]*\}\s*\}', signing_config.strip(), content)
          open(path, "w").write(content)
          PYEOF

      - name: Build APK
        working-directory: build_project
        run: flutter build apk --release

      - name: Build AAB
        working-directory: build_project
        run: flutter build appbundle --release

      - name: Create GitHub Release with APK & AAB
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: SuperMarket Build ${{ github.run_number }}
          files: |
            build_project/build/app/outputs/flutter-apk/app-release.apk
            build_project/build/app/outputs/bundle/release/app-release.aab
