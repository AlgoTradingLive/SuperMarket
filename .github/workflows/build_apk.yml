name: Build QuickMart APK

on:
  push:
    branches: [ main ]
    paths:
      - 'mobile/**'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Install Android SDK Platform 35
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Create fresh Flutter Android scaffold
        run: flutter create --platforms=android --org com.algotradinglive build_project

      - name: Update Target SDK to 35
        run: |
          sed -i "s/compileSdk = flutter.compileSdkVersion/compileSdk = 35/" build_project/android/app/build.gradle
          sed -i "s/targetSdk = flutter.targetSdkVersion/targetSdk = 35/" build_project/android/app/build.gradle
          sed -i "s/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 35/" build_project/android/app/build.gradle
          sed -i "s/compileSdk flutter.compileSdkVersion/compileSdk 35/" build_project/android/app/build.gradle
          sed -i 's/targetSdkVersion 34/targetSdkVersion 35/g' build_project/android/app/build.gradle
          sed -i 's/compileSdk 34/compileSdk 35/g' build_project/android/app/build.gradle
          echo "--- build.gradle मधले SDK संबंधी ओळी ---"
          grep -n -i "sdk" build_project/android/app/build.gradle

      - name: Copy our app code into scaffold
        run: |
          cp -r mobile/lib/. build_project/lib/
          cp mobile/pubspec.yaml build_project/pubspec.yaml
          mkdir -p build_project/assets
          cp -r mobile/assets/. build_project/assets/

      - name: Add INTERNET permission
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' build_project/android/app/src/main/AndroidManifest.xml

      - name: Set app name (label)
        run: |
          sed -i 's/android:label="build_project"/android:label="SuperMarket"/' build_project/android/app/src/main/AndroidManifest.xml

      - name: Set package name (applicationId + namespace)
        run: |
          sed -i 's/applicationId = "com.algotradinglive.build_project"/applicationId = "com.algotradinglive.supermarket"/' build_project/android/app/build.gradle
          sed -i 's/namespace = "com.algotradinglive.build_project"/namespace = "com.algotradinglive.supermarket"/' build_project/android/app/build.gradle

      - name: Move MainActivity to new package folder
        run: |
          OLD_DIR="build_project/android/app/src/main/kotlin/com/algotradinglive/build_project"
          NEW_DIR="build_project/android/app/src/main/kotlin/com/algotradinglive/supermarket"
          mkdir -p "$NEW_DIR"
          find "build_project/android/app/src/main" -name "MainActivity.kt" -exec mv {} "$NEW_DIR/MainActivity.kt" \;
          sed -i 's/package com.algotradinglive.build_project/package com.algotradinglive.supermarket/' "$NEW_DIR/MainActivity.kt"
          rm -rf "$OLD_DIR"

      - name: Get dependencies
        working-directory: build_project
        run: flutter pub get

      - name: Generate app icon
        working-directory: build_project
        run: flutter pub run flutter_launcher_icons

      - name: Decode keystore
        working-directory: build_project
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/super-market-release.jks

      - name: Create key.properties
        working-directory: build_project
        run: |
          cat > android/key.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=super-market-release.jks
          EOF

      - name: Configure signing in build.gradle
        working-directory: build_project
        run: |
          python3 - << 'PYEOF'
          import re
          path = "android/app/build.gradle"
          content = open(path).read()

          signing_load = '''
          def keystorePropertiesFile = rootProject.file("key.properties")
          def keystoreProperties = new Properties()
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }
          '''
          content = content.replace("android {", signing_load + "\nandroid {", 1)

          signing_config = '''
              signingConfigs {
                  release {
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                      storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                      storePassword keystoreProperties['storePassword']
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          '''
          content = re.sub(r'buildTypes\s*\{\s*release\s*\{[^}]*\}\s*\}', signing_config.strip(), content)
          open(path, "w").write(content)
          PYEOF

      - name: Build APK
        working-directory: build_project
        run: flutter build apk --release

      - name: Build AAB
        working-directory: build_project
        run: flutter build appbundle --release

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build_project/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB as artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build_project/build/app/outputs/bundle/release/app-release.aab
