name: Build QuickMart APK

on:
  push:
    branches: [ main ]
    paths:
      - 'mobile/**'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Create fresh Flutter Android scaffold
        run: flutter create --platforms=android --org com.algotradinglive build_project

      - name: Copy our app code into scaffold
        run: |
          cp -r mobile/lib/. build_project/lib/
          cp mobile/pubspec.yaml build_project/pubspec.yaml
          mkdir -p build_project/assets
          cp -r mobile/assets/. build_project/assets/

      - name: Add INTERNET permission
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' build_project/android/app/src/main/AndroidManifest.xml

      - name: Get dependencies
        working-directory: build_project
        run: flutter pub get

      - name: Generate app icon
        working-directory: build_project
        run: flutter pub run flutter_launcher_icons

      - name: Build APK
        working-directory: build_project
        run: flutter build apk --release

      - name: Build AAB
        working-directory: build_project
        run: flutter build appbundle --release
        
      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: quickmart-apk
          path: build_project/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB as artifact
        uses: actions/upload-artifact@v4
        with:
          name: quickmart-aab
          path: build_project/build/app/outputs/bundle/release/app-release.aab

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: QuickMart Build ${{ github.run_number }}
          files: |
            build_project/build/app/outputs/flutter-apk/app-release.apk
            build_project/build/app/outputs/bundle/release/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
