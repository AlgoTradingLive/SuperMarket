name: supermarket 
description: SuperMart - Mart style grocery app
publish_to: 'none'
version: 1.0.0+11

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.2.3
  geolocator: ^12.0.0
  firebase_core: ^3.6.0
  firebase_crashlytics: ^4.1.3
  razorpay_flutter: ^1.3.7
  firebase_messaging: ^15.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/banners/
    - assets/logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#2E7D32"
  adaptive_icon_foreground: "assets/icon/icon.png"

dependency_overrides:
  geolocator_android: 4.5.2
